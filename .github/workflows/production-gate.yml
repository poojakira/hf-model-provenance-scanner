name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ATTACK_CORE_REF: "288b4059fe36f1c7a3519fc00fd0b0502971d447"

concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout attack-v19-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: poojakira/attack-v19-core
          ref: ${{ env.ATTACK_CORE_REF }}
          path: attack-v19-core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build
      - name: Install
        run: |
          python -m pip install -e ./attack-v19-core
          python -m pip install -e ".[dev,service]"
      - name: Prepare pinned ATT&CK data
        run: python attack-v19-core/scripts/download_attack_data.py
      - name: Unit and integration tests
        run: python -m pytest tests -q
      - name: Static quality gate
        run: python -m pip install ruff==0.8.4 && python -m ruff check scanner tests
      - name: Build/release smoke check
        run: python -m build
