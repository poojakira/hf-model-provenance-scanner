# Generated poster artifacts must match committed evidence sources.
# Workflow-file maintenance is intentionally excluded from render triggers.
# Final generated artifacts are validated on the PR head before merge.
name: Poster Artifact Parity

on:
  pull_request:
    branches: [main]
    paths:
      - "poster/01_research_brief.md"
      - "poster/02_claim_ledger.md"
      - "poster/03_verified_metrics.md"
      - "poster/13_reproducibility.md"
      - "poster/render_poster.py"
      - ".github/workflows/poster-artifact-parity.yml"
  push:
    branches: [main]
    paths:
      - "poster/**"
      - ".github/workflows/poster-artifact-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use the reviewed poster Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Render poster from committed evidence
        id: render_poster
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.6
          export POSTER_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$POSTER_BROWSER"
          python poster/render_poster.py

      - name: Validate committed PNG parity
        shell: bash
        run: git diff --exit-code -- poster/poster.png

      - name: Record actual poster source and outputs
        if: always()
        env:
          RENDER_OUTCOME: ${{ steps.render_poster.outcome }}
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, platform, subprocess
          from pathlib import Path
          files = [Path('poster/poster.png'), Path('poster/poster_36x48.pdf')]
          manifest = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'render_outcome': os.environ['RENDER_OUTCOME'],
              'python': platform.python_version(),
              'pymupdf': importlib.metadata.version('PyMuPDF'),
              'artifacts': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.is_file()},
          }
          (Path(os.environ['RUNNER_TEMP']) / 'poster-manifest.json').write_text(json.dumps(manifest, indent=2))
          PY

      - name: Preserve generated poster evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-poster-${{ github.sha }}
          path: |
            poster/poster.png
            poster/poster_36x48.pdf
            ${{ runner.temp }}/poster-manifest.json
          retention-days: 14
