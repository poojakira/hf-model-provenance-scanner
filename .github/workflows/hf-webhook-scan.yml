name: HF Hub Webhook Scan

on:
  repository_dispatch:
    types: [hf_model_push]
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'HuggingFace repo ID (e.g., org/model-name)'
        required: true
        type: string
      fail_on:
        description: 'Fail on severity threshold'
        required: false
        default: 'high'
        type: choice
        options: ['critical', 'high', 'medium', 'low']

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  GVISOR_VERSION: "20240220"

jobs:
  scan:
    name: Scan HF Model Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      risk_level: ${{ steps.parse.outputs.risk_level }}
      risk_score: ${{ steps.parse.outputs.risk_score }}
      findings_count: ${{ steps.parse.outputs.findings_count }}
      critical_count: ${{ steps.parse.outputs.critical_count }}
      high_count: ${{ steps.parse.outputs.high_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install gVisor (runsc) for sandbox validation
        run: |
          set -o pipefail
          ARCH="$(uname -m)"
          URL="https://storage.googleapis.com/gvisor/releases/release/${{ env.GVISOR_VERSION }}/${ARCH}"
          curl -fsSL "${URL}/runsc" -o /usr/local/bin/runsc
          chmod +x /usr/local/bin/runsc
          runsc version

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run HF Model Scan
        id: scan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SANDBOX_BACKEND: gvisor
          FAIL_ON: ${{ github.event.inputs.fail_on || 'high' }}
        run: |
          REPO_ID="${{ github.event.client_payload.repo_id || github.event.inputs.repo_id }}"
          if [ -z "$REPO_ID" ]; then
            echo "ERROR: No repo_id provided"
            exit 1
          fi
          echo "Scanning repository: $REPO_ID"
          python -m scanner.cli "$REPO_ID" \
            --mode remote \
            --format json \
            --fail-on "${FAIL_ON}" \
            --token "${HF_TOKEN}" \
            --output scan_result.json

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-scan-result
          path: scan_result.json
          retention-days: 90

      - name: Parse scan results
        if: always()
        id: parse
        run: |
          if [ -f scan_result.json ]; then
            RISK_LEVEL=$(jq -r '.risk.level // "UNKNOWN"' scan_result.json)
            RISK_SCORE=$(jq -r '.risk.score // 0' scan_result.json)
            FINDINGS_COUNT=$(jq '.findings | length' scan_result.json)
            CRITICAL_COUNT=$(jq '[.findings[] | select(.severity == "critical")] | length' scan_result.json)
            HIGH_COUNT=$(jq '[.findings[] | select(.severity == "high")] | length' scan_result.json)
            echo "risk_level=$RISK_LEVEL" >> $GITHUB_OUTPUT
            echo "risk_score=$RISK_SCORE" >> $GITHUB_OUTPUT
            echo "findings_count=$FINDINGS_COUNT" >> $GITHUB_OUTPUT
            echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
            echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          else
            echo "risk_level=ERROR" >> $GITHUB_OUTPUT
            echo "risk_score=0" >> $GITHUB_OUTPUT
            echo "findings_count=0" >> $GITHUB_OUTPUT
            echo "critical_count=0" >> $GITHUB_OUTPUT
            echo "high_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Post results as issue comment (if triggered by repository_dispatch)
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const repo_id = "${{ github.event.client_payload.repo_id }}";
            const risk_level = "${{ steps.parse.outputs.risk_level }}";
            const risk_score = "${{ steps.parse.outputs.risk_score }}";
            const findings_count = "${{ steps.parse.outputs.findings_count }}";
            const critical_count = "${{ steps.parse.outputs.critical_count }}";
            const high_count = "${{ steps.parse.outputs.high_count }}";
            
            const body = [
              `## 🔍 HF Model Security Scan Results`,
              ``,
              `**Repository:** \`${repo_id}\``,
              `**Risk Level:** ${risk_level} (${risk_score}/100)`,
              `**Total Findings:** ${findings_count}`,
              `**Critical:** ${critical_count} | **High:** ${high_count}`,
              ``,
              `**Scan Details:** [View Artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `*Triggered by HuggingFace webhook on model push.*`,
            ].join('\n');
            
            // Create or update issue with scan results
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: ['hf-scan', repo_id.replace('/', '-')]
            });
            
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[HF Scan] ${repo_id} - ${risk_level} risk`,
                body: body,
                labels: ['hf-scan', repo_id.replace('/', '-'), `risk-${risk_level.toLowerCase()}`]
              });
            }

      - name: Send Slack notification (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          REPO_ID="${{ github.event.client_payload.repo_id || github.event.inputs.repo_id }}"
          RISK_LEVEL="${{ steps.parse.outputs.risk_level }}"
          RISK_SCORE="${{ steps.parse.outputs.risk_score }}"
          FINDINGS="${{ steps.parse.outputs.findings_count }}"
          CRITICAL="${{ steps.parse.outputs.critical_count }}"
          HIGH="${{ steps.parse.outputs.high_count }}"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🔍 *HF Model Scan Alert* for \`${REPO_ID}\`\nRisk: ${RISK_LEVEL} (${RISK_SCORE}/100)\nFindings: ${FINDINGS} (Critical: ${CRITICAL}, High: ${HIGH})\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>\"}" \
            "${SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Fail if threshold exceeded
        if: steps.parse.outputs.critical_count > 0 || steps.parse.outputs.high_count > 0
        run: |
          echo "::error::Scan failed: ${{ steps.parse.outputs.critical_count }} critical and ${{ steps.parse.outputs.high_count }} high severity findings detected"
          exit 1

  notify-hf:
    name: Post Results to HF Hub Discussion
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only runs for webhook-triggered scans. The HF Hub post is best-effort:
    # if secrets.HF_TOKEN is unset or lacks discussion-write scope, the step
    # logs and continues (see the try/except in the script below).
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Post scan results to HF Hub discussion
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_ID: ${{ github.event.client_payload.repo_id }}
          RISK_LEVEL: ${{ needs.scan.outputs.risk_level }}
          RISK_SCORE: ${{ needs.scan.outputs.risk_score }}
          FINDINGS: ${{ needs.scan.outputs.findings_count }}
          CRITICAL: ${{ needs.scan.outputs.critical_count }}
          HIGH: ${{ needs.scan.outputs.high_count }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN not configured; skipping HF Hub discussion post."
            exit 0
          fi
          # Best-effort: post scan summary to the HF repo discussions API.
          # Requires HF_TOKEN with discussion-write scope; failures are logged,
          # not fatal (this is a notification, not a security gate).
          python .github/scripts/post_hf_discussion.py
