name: HF Hub Webhook Scan

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'HuggingFace repo ID (e.g., org/model-name)'
        required: true
        type: string
      fail_on:
        description: 'Fail on severity threshold'
        required: false
        default: 'high'
        type: choice
        options: ['critical', 'high', 'medium', 'low']

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  scan:
    name: Scan HF Model Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      risk_level: ${{ steps.parse.outputs.risk_level }}
      risk_score: ${{ steps.parse.outputs.risk_score }}
      findings_count: ${{ steps.parse.outputs.findings_count }}
      critical_count: ${{ steps.parse.outputs.critical_count }}
      high_count: ${{ steps.parse.outputs.high_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run HF Model Scan
        id: scan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_ID: ${{ inputs.repo_id }}
          FAIL_ON: ${{ github.event.inputs.fail_on || 'high' }}
        run: |
          if [ -z "$REPO_ID" ]; then
            echo "ERROR: No repo_id provided"
            exit 1
          fi
          echo "Scanning repository: $REPO_ID"
          python -m scanner.cli "$REPO_ID" \
            --mode remote \
            --format json \
            --fail-on "${FAIL_ON}" \
            --token "${HF_TOKEN}" \
            --output scan_result.json

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf-scan-result
          path: scan_result.json
          retention-days: 90

      - name: Parse scan results
        if: always()
        id: parse
        run: |
          if [ -f scan_result.json ]; then
            RISK_LEVEL=$(jq -r '.risk.level // "UNKNOWN"' scan_result.json)
            RISK_SCORE=$(jq -r '.risk.score // 0' scan_result.json)
            FINDINGS_COUNT=$(jq '.findings | length' scan_result.json)
            CRITICAL_COUNT=$(jq '[.findings[] | select(.severity == "critical")] | length' scan_result.json)
            HIGH_COUNT=$(jq '[.findings[] | select(.severity == "high")] | length' scan_result.json)
            echo "risk_level=$RISK_LEVEL" >> $GITHUB_OUTPUT
            echo "risk_score=$RISK_SCORE" >> $GITHUB_OUTPUT
            echo "findings_count=$FINDINGS_COUNT" >> $GITHUB_OUTPUT
            echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
            echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          else
            echo "risk_level=ERROR" >> $GITHUB_OUTPUT
            echo "risk_score=0" >> $GITHUB_OUTPUT
            echo "findings_count=0" >> $GITHUB_OUTPUT
            echo "critical_count=0" >> $GITHUB_OUTPUT
            echo "high_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO_ID: ${{ inputs.repo_id }}
          RISK_LEVEL: ${{ steps.parse.outputs.risk_level }}
          RISK_SCORE: ${{ steps.parse.outputs.risk_score }}
          FINDINGS: ${{ steps.parse.outputs.findings_count }}
          CRITICAL: ${{ steps.parse.outputs.critical_count }}
          HIGH: ${{ steps.parse.outputs.high_count }}
        run: |
          jq -n --arg repo "$REPO_ID" --arg level "$RISK_LEVEL" \
            --arg score "$RISK_SCORE" --arg findings "$FINDINGS" \
            --arg critical "$CRITICAL" --arg high "$HIGH" \
            --arg details "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: ("HF Model Scan Alert for " + $repo + "\nRisk: " + $level + " (" + $score + "/100)\nFindings: " + $findings + " (Critical: " + $critical + ", High: " + $high + ")\n" + $details)}' \
            > slack-payload.json
          curl --fail --silent --show-error --max-time 15 \
            -X POST -H 'Content-type: application/json' \
            --data-binary @slack-payload.json "$SLACK_WEBHOOK_URL"

      - name: Fail if threshold exceeded
        if: steps.parse.outputs.critical_count > 0 || steps.parse.outputs.high_count > 0
        run: |
          echo "::error::Scan failed: ${{ steps.parse.outputs.critical_count }} critical and ${{ steps.parse.outputs.high_count }} high severity findings detected"
          exit 1
