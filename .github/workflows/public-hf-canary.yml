name: Public Hugging Face Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install scanner
        run: python -m pip install -e ".[dev]"
      - name: Scan public repositories at resolved immutable commits
        run: python validation/public_hf_canary.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-hf-canary
          path: validation/public-hf-canary.json
