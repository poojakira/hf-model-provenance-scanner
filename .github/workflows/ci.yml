name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.8.4"
  PYRIGHT_VERSION: "1.1.388"
  BANDIT_VERSION: "1.8.3"
  PIP_AUDIT_VERSION: "2.10.1"
  CYCLONEDX_VERSION: "5.1.1"
  GVISOR_VERSION: "20260907.0"
  FIRECRACKER_VERSION: "v1.5.0"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff==${{ env.RUFF_VERSION }}

      - name: Run Ruff Linter
        run: ruff check scanner tests --output-format=github

      - name: Run Ruff Formatter Check
        run: ruff format --check scanner tests

  typecheck:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout attack-v19-core (optional)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          repository: poojakira/attack-v19-core
          path: attack-v19-core

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyright==${{ env.PYRIGHT_VERSION }}
          if [ -d "attack-v19-core" ]; then
            pip install -e ./attack-v19-core
            pip install -e ".[dev,service,attack]"
          else
            pip install -e ".[dev,service]"
          fi

      - name: Run Pyright
        run: |
          if [ -d "attack-v19-core" ]; then
            PYTHONPATH=.:attack-v19-core pyright scanner
          else
            pyright scanner
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install bandit==${{ env.BANDIT_VERSION }}
          pip install pip-audit==${{ env.PIP_AUDIT_VERSION }}
          pip install cyclonedx-bom==${{ env.CYCLONEDX_VERSION }}
          pip install -e ".[dev,service]"

      - name: Bandit SAST (fail on HIGH/MEDIUM)
        run: |
          bandit -r scanner/ -ll -f json -o bandit-report.json
          python .github/scripts/check_bandit.py

      - name: pip-audit (fail on known vulns)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --skip-editable --format json -o pip-audit.json
          python .github/scripts/check_pip_audit.py

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --outfile sbom.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 90

  sandbox-validation:
    name: Sandbox Validation (gVisor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install gVisor (runsc)
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          URL="https://storage.googleapis.com/gvisor/releases/release/${{ env.GVISOR_VERSION }}/${ARCH}"
          curl -fsSL "${URL}/gvisor.tar.zstd" -o /tmp/gvisor.tar.zstd
          curl -fsSL "${URL}/gvisor.tar.zstd.sha512" -o /tmp/gvisor.tar.zstd.sha512
          (
            cd /tmp
            sha512sum -c gvisor.tar.zstd.sha512
          )
          sudo tar --zstd -xf /tmp/gvisor.tar.zstd -C /usr/local/bin
          /usr/local/bin/runsc --version

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,service]"

      - name: Run sandbox validation tests
        env:
          HF_SANDBOX_BACKEND: gvisor
        run: |
          python -m pytest tests/ -v -k "sandbox" --tb=short -W error::DeprecationWarning:scanner

      - name: Require a real gVisor sandbox execution probe
        env:
          HF_SANDBOX_BACKEND: gvisor
        run: |
          python - <<'PY'
          from scanner.analyzer.sandbox_executor import _check_gvisor_available
          if not _check_gvisor_available():
              raise SystemExit("gVisor binary installed but sandbox execution probe failed")
          print("gVisor rootless runsc-do execution probe passed")
          PY

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout attack-v19-core (optional)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          repository: poojakira/attack-v19-core
          path: attack-v19-core

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -d "attack-v19-core" ]; then
            pip install -e ./attack-v19-core
            python attack-v19-core/scripts/download_attack_data.py
            pip install -e ".[dev,service,attack]"
          else
            pip install -e ".[dev,service]"
          fi

      - name: Run tests with coverage
        run: |
          if [ -d "attack-v19-core" ]; then
            PYTHONPATH=.:attack-v19-core pytest tests/ -v --tb=short -p pytest_cov \
              --cov=scanner \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-fail-under=55 \
              -W error::DeprecationWarning:scanner \
              -W error::PendingDeprecationWarning:scanner
          else
            pytest tests/ -v --tb=short -p pytest_cov \
              --cov=scanner \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-fail-under=55 \
              -W error::DeprecationWarning:scanner \
              -W error::PendingDeprecationWarning:scanner
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      - name: Verify test collection
        run: |
          if [ -d "attack-v19-core" ]; then
            count=$(PYTHONPATH=.:attack-v19-core python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= tests)')
          else
            count=$(python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= tests)')
          fi
          count=${count:-0}
          if [ "$count" -lt 10 ]; then
            echo "Expected at least 10 tests collected, got $count"
            exit 1
          fi
          echo "Collected $count tests"

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() }}
    permissions:
      security-events: write
      contents: read
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ always() }}
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local/test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, security, test, codeql]
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scanner image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Attest scanner image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true