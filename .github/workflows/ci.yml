name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: |
          mypy src/hf_scanner --strict

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=hf_scanner \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --timeout=120 \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: true

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run performance benchmark
        run: |
          python benchmarks/scan_perf.py \
            --output benchmark-results.json \
            --threshold 50

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Check for performance regression
        run: |
          python -c "
          import json, sys
          results = json.loads(open('benchmark-results.json').read())
          if not results['passed']:
              print(f'PERFORMANCE REGRESSION: p95={results[\"statistics\"][\"latency_ms\"][\"p95\"]}ms > 50ms threshold')
              sys.exit(1)
          print(f'Performance OK: p95={results[\"statistics\"][\"latency_ms\"][\"p95\"]}ms')
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run safety check
        run: pip-audit

      - name: Run bandit
        run: bandit -r src/hf_scanner -ll

  release:
    runs-on: ubuntu-latest
    needs: [test, benchmark, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write  # For trusted publishing & SBOM attestation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine sigstore

      - name: Build package
        run: python -m build

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment \
            --output-format json \
            --output-file sbom.cdx.json

      - name: Sign SBOM with Sigstore
        run: |
          python -m sigstore sign \
            --output-signature sbom.cdx.json.sig \
            --output-certificate sbom.cdx.json.crt \
            sbom.cdx.json

      - name: Attest SBOM to package
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing — no API token needed

      - name: Upload SBOM as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.json.sig
            sbom.cdx.json.crt
