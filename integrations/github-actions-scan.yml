# Ready-to-use GitHub Actions workflow — copy to your repo's .github/workflows/
name: Model Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install HF Scanner from immutable revision
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/poojakira/hf-model-provenance-scanner.git@9a9aa1fe37dd3366a0034ab3d6d5b35222a26fc4"

      - name: Scan repository
        run: |
          hf-scanner . --mode local --format sarif --output results.sarif --fail-on high --enforce

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          sarif_file: results.sarif
