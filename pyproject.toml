[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-scanner"
version = "0.2.0"
description = "ML supply chain provenance scanner for Hugging Face repositories"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "psutil>=5.9",
]

[project.scripts]
hf-scanner = "scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]
attack = ["attack-v19-core>=19.1,<20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.setuptools.package-data]
"scanner.data" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = [
    "N802",
    "E741",
    "B007",
    "E501",
    "W293",
    "F841",
    "S101",
    "S310",
    "S108",
    "S603",
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# Pickle opcode constants are intentionally uppercase to match the pickle spec.
"tests/test_integration_hf.py" = ["N806"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    'ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning',
]