[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-model-provenance-scanner"
version = "1.0.0"
description = "Scan Hugging Face model repos for pickle exploits, supply-chain signals, and provenance issues without downloading full weights"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Pooja Kiran"}]
keywords = ["security", "ml", "huggingface", "supply-chain", "provenance", "sarif", "pickle", "model-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/poojakira/hf-model-provenance-scanner"
Documentation = "https://poojakira.github.io/hf-model-provenance-scanner/"
Issues = "https://github.com/poojakira/hf-model-provenance-scanner/issues"
Changelog = "https://github.com/poojakira/hf-model-provenance-scanner/blob/main/CHANGELOG.md"

[project.scripts]
hf-scanner = "scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "cryptography>=41.0",
]
attack = ["attack-v19-core>=19.1,<20"]
signing = ["cryptography>=41.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.setuptools.package-data]
"scanner.data" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = [
    "N802",
    "E741",
    "B007",
    "E501",
    "W293",
    "F841",
    "S101",
    "S310",
    "S108",
    "S603",
    "S110",
    "S112",
    "S311",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    'ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning',
]